name: Build

on:
  pull_request:
    branches: [develop]
  push:
    branches-ignore: [develop, main, default]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew build --stacktrace

      - name: Name debug APK with build version
        run: |
          VERSION_NAME=$(grep '^epic.versionName=' gradle.properties | cut -d= -f2)
          APK_NAME="epic-v2-${VERSION_NAME}-${GITHUB_RUN_NUMBER}-debug"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}.apk"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
